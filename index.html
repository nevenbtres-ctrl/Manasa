<style>
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:radial-gradient(circle at 20% 10%, #1b4b68, #0a1c28 65%);
    color:#0f172a;
  }

  .card{
    width:100%;max-width:470px;background:#fff;border-radius:18px;
    overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.45);
  }

  .head{
    position:relative;padding:20px 18px 16px;text-align:center;color:#fff;
    background:linear-gradient(135deg,#0b3d5c 0%,#14719c 100%);
  }
  .head::after{
    content:"";position:absolute;bottom:0;left:50%;
    transform:translateX(-50%);width:90px;height:4px;
    border-radius:4px 4px 0 0;background:#f0b429;
  }
  .head h1{font-size:22px;font-weight:800;letter-spacing:.6px}
  .head h2{margin-top:6px;font-size:13px;font-weight:500;letter-spacing:.5px;opacity:.88}

  .body{padding:16px 18px 10px}

  .site{
    text-align:center;background:#eef6fb;border:1px solid #cfe4f0;
    color:#0b3d5c;font-weight:700;font-size:14px;
    border-radius:10px;padding:9px 10px;margin-bottom:14px;
  }

  .row{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:8px 0;border-bottom:1px dashed #e6edf3;
  }
  .row:last-child{border-bottom:0}

  .lbl{font-size:14px;font-weight:600;color:#33506b;white-space:nowrap}
  .sep{height:1px;background:#e6edf3;margin:8px 0}

  input[type=number],input[type=date]{
    width:150px;flex:0 0 auto;padding:7px 10px;
    font-family:inherit;font-size:15px;font-weight:800;
    text-align:center;direction:ltr;
    color:#0b3d5c;background:#f8fbfd;
    border:1px solid #cbdce8;border-radius:9px;outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=number]:focus,input[type=date]:focus{
    background:#fff;border-color:#14719c;
    box-shadow:0 0 0 3px rgba(20,113,156,.15);
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=date]{font-size:14px;font-weight:700}

  .foot{
    text-align:center;font-size:12px;font-weight:600;letter-spacing:.4px;
    padding:12px;color:#5b7a92;background:#f4f8fb;border-top:1px solid #e3edf4;
  }

  .btns{width:100%;max-width:470px;display:flex;flex-wrap:wrap;gap:10px}
  .btn{
    flex:1 1 130px;border:0;border-radius:12px;padding:13px 10px;
    font-family:inherit;font-size:14px;font-weight:700;color:#fff;
    cursor:pointer;transition:transform .15s, filter .15s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn.wa     {background:linear-gradient(135deg,#25d366,#128c7e)}
  .btn.save   {background:linear-gradient(135deg,#2b7fb8,#0b3d5c)}
  .btn.archive{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
  .btn.clear  {background:linear-gradient(135deg,#ef4444,#b91c1c)}

  .modal{
    display:none;position:fixed;inset:0;
    background:rgba(6,20,30,.75);z-index:1000;
    align-items:center;justify-content:center;padding:12px;
  }
  .modal.show{display:flex}

  .modal-content{
    background:#fff;border-radius:14px;width:100%;max-width:560px;
    max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .modal-header{
    padding:14px 18px;background:linear-gradient(135deg,#0b3d5c,#14719c);
    color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .modal-header h2{font-size:17px;font-weight:800}
  .close-btn{
    background:transparent;border:0;color:#fff;font-size:26px;
    line-height:1;cursor:pointer;padding:0 4px;
  }

  .sync-indicator{
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
    background:rgba(255,255,255,.2);
  }
  .sync-indicator.online{background:#10b981}
  .sync-indicator.offline{background:#ef4444}
  .sync-indicator.loading{background:#f59e0b}

  .modal-toolbar{
    padding:10px 12px;background:#f4f8fb;
    border-bottom:1px solid #e3edf4;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .modal-toolbar input{
    flex:1 1 140px;padding:9px 12px;
    border:1px solid #cbdce8;border-radius:9px;
    font-family:inherit;font-size:14px;background:#fff;outline:none;
  }
  .modal-toolbar input:focus{
    border-color:#14719c;
    box-shadow:0 0 0 3px rgba(20,113,156,.15);
  }
  .modal-toolbar input[type=date]{
    flex:0 0 145px;font-size:13px;direction:ltr;min-height:38px;
  }
  .modal-toolbar .btn{
    flex:0 0 auto;padding:9px 14px;font-size:13px;border-radius:9px;
  }
  .btn.excel{background:linear-gradient(135deg,#1e8e3e,#0d652d)}
  .btn.trash{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .btn.reset{background:linear-gradient(135deg,#94a3b8,#64748b);padding:9px 12px;font-size:12px}
  .btn.migrate{background:linear-gradient(135deg,#3b82f6,#2563eb);padding:9px 14px;font-size:13px;border-radius:9px;}

  .modal-body{padding:12px;overflow-y:auto;flex:1}

  .archive-count{
    text-align:center;color:#5b7a92;
    font-size:12px;font-weight:600;padding:4px 0 10px;
  }

  .archive-item{
    border:1px solid #cfe4f0;border-radius:10px;
    padding:10px 12px;margin-bottom:8px;background:#f8fbfd;
  }
  .archive-item-header{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:8px;margin-bottom:8px;
    border-bottom:1px dashed #cfe4f0;
    font-size:13px;font-weight:700;color:#0b3d5c;
    gap:6px;flex-wrap:wrap;
  }
  .archive-item-header .del-btn{
    background:transparent;border:0;font-size:16px;
    cursor:pointer;padding:2px 4px;opacity:.7;
  }
  .archive-item-header .del-btn:hover{opacity:1}

  .archive-item-body{
    display:grid;grid-template-columns:1fr 1fr;
    gap:6px 12px;font-size:13px;color:#33506b;
  }
  .archive-item-body b{color:#0b3d5c;font-weight:800;direction:ltr;display:inline-block}

  .empty{text-align:center;padding:30px 10px;color:#8ba3b8;font-weight:600;font-size:14px}

  #overlay{
    position:fixed;inset:0;background:rgba(6,20,30,.65);
    display:none;align-items:center;justify-content:center;
    z-index:1200;color:#fff;font-weight:700;font-size:15px;
  }
  #overlay.show{display:flex}
  #overlay .box{
    background:#0b3d5c;border:1px solid #14719c;
    padding:18px 26px;border-radius:14px;
    display:flex;align-items:center;gap:12px;
  }
  .spin{
    width:20px;height:20px;border-radius:50%;
    border:3px solid rgba(255,255,255,.3);
    border-top-color:#f0b429;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:420px){
    .lbl{font-size:12.5px;white-space:normal}
    input[type=number],input[type=date]{width:128px;font-size:14px}
    .head h1{font-size:19px}
    .archive-item-body{grid-template-columns:1fr}
  }
</style>
</head>

<body>

  <div class="card" id="card">
    <div class="head">
      <h1>Al-Tuba Oil Depot</h1>
      <h2>Oil Tanker Loading Platforms</h2>
    </div>

    <div class="body">
      <div class="site">موقع شمعات تحميل (مستودع الطوبة)</div>
      <div class="row">
        <label class="lbl" for="dateInput">التاريخ</label>
        <input id="dateInput" type="date">
      </div>
      <div class="sep"></div>
      <div class="row">

        <input id="tankers" type="number" step="any" inputmode="decimal">
      </div>
      <div class="row">
        <label class="lbl" for="barrels">الكمية بالبرميل (يوم)</label>
        <input id="barrels" type="number" step="any" inputmode="decimal">
      </div>
      <div class="row">
        <label class="lbl" for="cumTankers">العدد التراكمي للصهاريج</label>
        <input id="cumTankers" type="number" step="any" inputmode="decimal">
      </div>
      <div class="row">
        <label class="lbl" for="cumBarrels">الكمية التراكمية بالبرميل</label>
        <input id="cumBarrels" type="number" step="any" inputmode="decimal">
      </div>
    </div>

    <div class="foot">Programming by Osama Abdul-Abbad</div>
  </div>

  <div class="btns">
    <button class="btn wa"      id="btnWa">إرسال الصورة عبر واتساب</button>
    <button class="btn save"    id="btnSave">حفظ صورة</button>
    <button class="btn archive" id="btnArchive">الأرشيف</button>
    <button class="btn clear"   id="btnClear">مسح</button>
  </div>

  <div id="archiveModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📂 أرشيف الصهاريج</h2>
        <span id="syncStatus" class="sync-indicator loading">⏳ جاري الاتصال...</span>
        <button class="close-btn" id="closeArchive">×</button>
      </div>
      <div class="modal-toolbar">
        <input type="text" id="archiveSearch" placeholder="🔍 بحث بالتاريخ أو الرقم...">
        <input type="date" id="archiveDateFilter">
        <button class="btn reset" id="btnResetFilter">🔄 الكل</button>
        <!-- زر الترحيل أصبح ظاهراً دائماً -->
        <button class="btn migrate" id="btnMigrate">☁️ ترحيل السجلات القديمة</button>
        <button class="btn excel" id="btnExportExcel">📊 Excel</button>

  <div id="passwordModal" class="modal">
    <div class="modal-content" style="max-width:340px">
      <div class="modal-header">
        <h2>🔒 التحقق من الهوية</h2>
        <button class="close-btn" id="closePassword">×</button>
      </div>
      <div class="modal-body" style="padding:20px">
        <p style="text-align:center;color:#b91c1c;font-weight:700;margin-bottom:16px;font-size:14px;line-height:1.7">
          غير مصرح لك الحذف إذا لم تمتلك كلمة المرور
        </p>
        <input type="password" id="passwordInput" inputmode="numeric"
               placeholder="•••••••" maxlength="20"
               style="width:100%;padding:12px;text-align:center;font-size:18px;
                      border:2px solid #cbdce8;border-radius:10px;outline:none;
                      direction:ltr;letter-spacing:4px;font-weight:700" />
        <p id="passwordError"
           style="text-align:center;color:#dc2626;font-size:13px;
                  margin-top:10px;font-weight:700;display:none">
          ❌ كلمة المرور غير صحيحة
        </p>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn" id="confirmPassword"
                  style="flex:1;background:linear-gradient(135deg,#25d366,#128c7e)">
            تأكيد

          <button class="btn" id="cancelPassword"
                  style="flex:1;background:linear-gradient(135deg,#94a3b8,#64748b)">
            إلغاء

    </div>
  </div>

  <div id="overlay"><div class="box"><span class="spin"></span><span id="ovText">جاري تحضير الصورة...</span></div></div>

<script>
/* =========================================================
   ⚙️ إعداد Firebase الخاص بك
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyA6etxglLiUfiUDRPT7jigoCJtbAPwzWmnw",
  authDomain: "manasa-ece8c.firebaseapp.com",
  projectId: "manasa-ece8c",
  storageBucket: "manasa-ece8c.firebasestorage.app",
  messagingSenderId: "497003265490",
  appId: "1:497003265490:web:78c01c0d14eeed972b1c0b",
  measurementId: "G-36P5JTVYZM"
};

const USE_CLOUD = true;
let db = null;
const archiveRef = () => db.collection('archive');

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(err => {
    console.log('Persistence:', err.code);
  });
} catch(e) {
  console.error('Firebase init failed:', e);
}

/* ========== البيانات ========== */
const ARCHIVE_KEY = 'al_tuba_archive';
let currentArchive = [];
let archiveLoaded = false;

/* ========== عناصر DOM ========== */
const pad = n => String(n).padStart(2, '0');
const overlay  = document.getElementById('overlay');
const ovText   = document.getElementById('ovText');
const cardEl   = document.getElementById('card');
const btnWa    = document.getElementById('btnWa');
const btnSave  = document.getElementById('btnSave');
const btnClear = document.getElementById('btnClear');
const archiveModal      = document.getElementById('archiveModal');
const archiveList       = document.getElementById('archiveList');
const archiveSearch     = document.getElementById('archiveSearch');
const archiveDateFilter = document.getElementById('archiveDateFilter');
const archiveCount      = document.getElementById('archiveCount');
const syncStatus        = document.getElementById('syncStatus');
const btnMigrate        = document.getElementById('btnMigrate');

const showOverlay = t => { ovText.textContent = t; overlay.classList.add('show'); };
const hideOverlay = () => overlay.classList.remove('show');

/* ========== Toast ========== */
function showToast(message, duration = 2800){
  const t = document.createElement('div');
  t.textContent = message;
  t.style.cssText = `
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#0b3d5c;color:#fff;padding:11px 22px;border-radius:10px;
    font-weight:700;font-size:13.5px;z-index:2000;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;
    transition:opacity .3s, transform .3s;pointer-events:none;
    max-width:90vw;text-align:center;
  `;
  document.body.appendChild(t);
  requestAnimationFrame(() => {
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
    setTimeout(() => t.remove(), 350);
  }, duration);
}

/* ========== مساعدات ========== */
function buildFileName(){
  const d = new Date();
  return `Al-Tuba-Oil-Depot_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.png`;
}

async function cardToBlob(){
  if (typeof html2canvas !== 'function') throw new Error('تعذّر تحميل مكتبة الصور');
  const canvas = await html2canvas(cardEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png', 1.0));
  if (!blob) throw new Error('فشل إنشاء الصورة');
  return blob;
}

function downloadBlob(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function formatISODate(iso){
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  if (!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function updateSyncStatus(state){
  syncStatus.className = 'sync-indicator ' + state;
  if (state === 'online')  syncStatus.textContent = '🟢 متصل بالسحابة';
  if (state === 'offline') syncStatus.textContent = '🔴 غير متصل';
  if (state === 'loading') syncStatus.textContent = '⏳ جاري الاتصال...';
  if (state === 'local')   syncStatus.textContent = '💾 محلي فقط';
}

/* ========== طبقة البيانات ========== */
async function initArchive(){
  updateSyncStatus('loading');
  archiveRef().orderBy('id', 'desc').onSnapshot(snapshot => {
    currentArchive = snapshot.docs.map(d => ({ _docId: d.id, ...d.data() }));
    archiveLoaded = true;
    updateSyncStatus('online');
    if (archiveModal.classList.contains('show')) renderArchive();
  }, err => {
    console.error('Snapshot error:', err);
    updateSyncStatus('offline');
  });
}

async function addToArchive(record){
  await archiveRef().add(record);
}

async function removeFromArchive(id){
  const entry = currentArchive.find(e => e.id === id);
  if (entry && entry._docId) await archiveRef().doc(entry._docId).delete();
}

async function clearAllArchive(){
  const snapshot = await archiveRef().get();
  const batch = db.batch();
  snapshot.docs.forEach(d => batch.delete(d.ref));
  await batch.commit();
}

/* ========== حفظ تلقائي ========== */
async function saveToArchive(){
  const date       = document.getElementById('dateInput').value;
  const tankers    = document.getElementById('tankers').value;
  const barrels    = document.getElementById('barrels').value;
  const cumTankers = document.getElementById('cumTankers').value;
  const cumBarrels = document.getElementById('cumBarrels').value;

  if (!date && !tankers && !barrels && !cumTankers && !cumBarrels) return false;

  if (currentArchive.length > 0) {
    const last = currentArchive[0];
    if (last.date === date && last.tankers === tankers &&
        last.barrels === barrels && last.cumTankers === cumTankers &&
        last.cumBarrels === cumBarrels) {
      return false;
    }
  }

  const now = new Date();
  const savedAt = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const record = {
    id: Date.now(),
    date, savedAt, tankers, barrels, cumTankers, cumBarrels
  };

  try {
    await addToArchive(record);
    return true;
  } catch(e) {
    console.error('Save failed:', e);
    showToast('❌ فشل الاتصال بالسحابة، تم الحفظ محلياً فقط');
    const local = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]');
    local.unshift(record);
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(local));
    return true;
  }
}

/* ========== زر الترحيل (Migration) ========== */
btnMigrate.addEventListener('click', async () => {
  const localData = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]');
  
  if (localData.length === 0) {
    alert('لا توجد سجلات قديمة في هذا الجهاز لترحيلها.\n\nملاحظة: السجلات القديمة تكون محفوظة فقط على الجهاز الذي أدخلتها عليه قبل ربط السحابة.');
    return;
  }

  if (!confirm(`هل أنت متأكد من ترحيل ${localData.length} سجل قديم إلى السحابة؟\nسيتم مسحها من الذاكرة المحلية لتجنب التكرار.`)) return;

  const oldText = btnMigrate.textContent;
  btnMigrate.textContent = '⏳ جاري الترحيل...';
  btnMigrate.disabled = true;

  try {
    for (let i = 0; i < localData.length; i += 500) {
      const batch = db.batch();
      const chunk = localData.slice(i, i + 500);
      chunk.forEach(record => {
        const docRef = archiveRef().doc(); 
        batch.set(docRef, record);
      });
      await batch.commit();
    }

    localStorage.removeItem(ARCHIVE_KEY);
    btnMigrate.textContent = oldText;
    btnMigrate.disabled = false;
    showToast(`✓ تم ترحيل ${localData.length} سجل بنجاح!`);
  } catch (error) {
    console.error('Migration failed:', error);
    alert('حدث خطأ أثناء الترحيل: ' + error.message);
    btnMigrate.textContent = oldText;
    btnMigrate.disabled = false;
  }
});

/* ========== عرض الأرشيف ========== */
function renderArchive(){
  if (!archiveLoaded) {
    archiveList.innerHTML = '<div class="empty">⏳ جاري تحميل البيانات...</div>';
    return;
  }

  const textFilter = archiveSearch.value.trim().toLowerCase();
  const dateFilter = archiveDateFilter.value;

  let filtered = currentArchive;
  if (dateFilter) filtered = filtered.filter(e => e.date === dateFilter);
  if (textFilter) {
    filtered = filtered.filter(e =>
      String(e.date || '').toLowerCase().includes(textFilter) ||
      String(e.savedAt || '').toLowerCase().includes(textFilter) ||
      formatISODate(e.date).includes(textFilter) ||
      String(e.tankers || '').includes(textFilter) ||
      String(e.barrels || '').includes(textFilter) ||
      String(e.cumTankers || '').includes(textFilter) ||
      String(e.cumBarrels || '').includes(textFilter)
    );
  }

  archiveCount.textContent = `إجمالي السجلات: ${filtered.length}`;

  if (filtered.length === 0) {
    archiveList.innerHTML = '<div class="empty">لا توجد سجلات مطابقة</div>';
    return;
  }

  archiveList.innerHTML = filtered.map(e => `
    <div class="archive-item">
      <div class="archive-item-header">
        <span>📅 ${formatISODate(escapeHTML(e.date))}</span>
        <span>🕐 ${escapeHTML(e.savedAt)}</span>
        <button class="del-btn" data-id="${e.id}" title="حذف">🗑️</button>
      </div>
      <div class="archive-item-body">
        <div>عدد الصهاريج (يوم): <b>${escapeHTML(e.tankers) || '—'}</b></div>
        <div>الكمية بالبرميل (يوم): <b>${escapeHTML(e.barrels) || '—'}</b></div>
        <div>العدد التراكمي: <b>${escapeHTML(e.cumTankers) || '—'}</b></div>
        <div>الكمية التراكمية: <b>${escapeHTML(e.cumBarrels) || '—'}</b></div>
      </div>
    </div>
  `).join('');

  archiveList.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => requestDelete(Number(btn.dataset.id)));
  });
}

/* ========== كلمة المرور ========== */
const DELETE_PASSWORD = '2291977';
let passwordCallback = null;
const passwordModal = document.getElementById('passwordModal');
const passwordInput = document.getElementById('passwordInput');
const passwordError = document.getElementById('passwordError');

function requirePassword(callback){
  passwordCallback = callback;
  passwordInput.value = '';
  passwordError.style.display = 'none';
  passwordModal.classList.add('show');
  setTimeout(() => passwordInput.focus(), 120);
}

function closePasswordModal(){
  passwordModal.classList.remove('show');
  passwordCallback = null;
  passwordInput.value = '';
  passwordError.style.display = 'none';
}

document.getElementById('confirmPassword').addEventListener('click', () => {
  if (passwordInput.value === DELETE_PASSWORD) {
    const cb = passwordCallback;
    closePasswordModal();
    if (cb) cb();
  } else {
    passwordError.style.display = 'block';
    passwordInput.value = '';
    passwordInput.focus();
  }
});

document.getElementById('cancelPassword').addEventListener('click', closePasswordModal);
document.getElementById('closePassword').addEventListener('click', closePasswordModal);
passwordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('confirmPassword').click();
});
passwordModal.addEventListener('click', e => {
  if (e.target === passwordModal) closePasswordModal();
});

async function requestDelete(id){
  requirePassword(async () => {
    try {
      await removeFromArchive(id);
      showToast('✓ تم حذف السجل من السحابة');
    } catch(e) {
      showToast('❌ فشل الحذف: ' + e.message);
    }
  });
}

/* ========== فتح/إغلاق الأرشيف ========== */
function openArchive(){
  archiveSearch.value = '';
  archiveDateFilter.value = '';
  archiveModal.classList.add('show');
  renderArchive();
}
function closeArchive(){ archiveModal.classList.remove('show'); }

document.getElementById('btnArchive').addEventListener('click', openArchive);
document.getElementById('closeArchive').addEventListener('click', closeArchive);
archiveModal.addEventListener('click', e => {
  if (e.target === archiveModal) closeArchive();
});
archiveSearch.addEventListener('input', renderArchive);
archiveDateFilter.addEventListener('change', renderArchive);
document.getElementById('btnResetFilter').addEventListener('click', () => {
  archiveSearch.value = '';
  archiveDateFilter.value = '';
  renderArchive();
});

document.getElementById('btnClearArchive').addEventListener('click', () => {
  requirePassword(async () => {
    try {
      await clearAllArchive();
      showToast('✓ تم حذف كل السجلات');
    } catch(e) {
      showToast('❌ فشل الحذف: ' + e.message);
    }
  });
});

/* ========== تصدير Excel ========== */
function exportToExcel(silent = false){
  const archive = currentArchive;
  if (archive.length === 0) {
    if (!silent) alert('الأرشيف فارغ، لا يوجد ما يُصدَّر.');
    return false;
  }
  if (typeof XLSX === 'undefined') {
    if (!silent) alert('تعذّر تحميل مكتبة Excel');
    return false;
  }

  const rows = archive.map(e => ({
    'التاريخ'                   : formatISODate(e.date),
    'وقت الحفظ'                 : e.savedAt || '',
    'عدد الصهاريج (يوم)'        : e.tankers || '',
    'الكمية بالبرميل (يوم)'     : e.barrels || '',
    'العدد التراكمي للصهاريج'   : e.cumTankers || '',
    'الكمية التراكمية بالبرميل' : e.cumBarrels || ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:20},{wch:22},{wch:26},{wch:28},{wch:30}];
  try { ws['!views'] = [{ RTL: true }]; } catch(_){}

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الأرشيف');
  XLSX.writeFile(wb, 'ارشيف الصهاريج.xlsx');
  return true;
}

document.getElementById('btnExportExcel').addEventListener('click', () => {
  if (exportToExcel(false)) showToast('✓ تم تصدير ملف Excel');
});

function autoSaveExcel(){
  if (currentArchive.length === 0) return;
  setTimeout(() => {
    try {
      if (exportToExcel(true)) showToast('✓ تم حفظ ملف Excel تلقائياً');
    } catch(e){ console.log('Excel auto-save failed:', e); }
  }, 150);
}

/* ========== واتساب ========== */
btnWa.addEventListener('click', async () => {
  await saveToArchive();
  autoSaveExcel();

  const oldText = btnWa.textContent;
  btnWa.disabled = true;
  showOverlay('جاري تحضير الصورة...');

  try {
    const blob     = await cardToBlob();
    const fileName = buildFileName();
    const file     = new File([blob], fileName, { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        hideOverlay(); btnWa.disabled = false; btnWa.textContent = oldText;
        return;
      } catch(err) {
        if (err.name === 'AbortError') {
          hideOverlay(); btnWa.disabled = false; btnWa.textContent = oldText;
          return;
        }
      }
    }

    hideOverlay();
    downloadBlob(blob, fileName);
    btnWa.disabled = false; btnWa.textContent = oldText;
    alert('جهازك لا يدعم مشاركة الملفات مباشرة.\nتم حفظ الصورة: ' + fileName);
  } catch(err) {
    hideOverlay(); btnWa.disabled = false; btnWa.textContent = oldText;
    alert('حدث خطأ: ' + err.message);
  }
});

/* ========== حفظ صورة ========== */
btnSave.addEventListener('click', async () => {
  await saveToArchive();
  autoSaveExcel();

  const oldText = btnSave.textContent;
  btnSave.disabled = true;
  showOverlay('جاري حفظ الصورة...');
  try {
    const blob = await cardToBlob();
    downloadBlob(blob, buildFileName());
  } catch(err) {
    alert('حدث خطأ: ' + err.message);
  } finally {
    hideOverlay(); btnSave.disabled = false; btnSave.textContent = oldText;
  }
});

/* ========== مسح النموذج ========== */
btnClear.addEventListener('click', () => {
  requirePassword(() => {
    ['dateInput','tankers','barrels','cumTankers','cumBarrels'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('dateInput').focus();
    showToast('✓ تم مسح النموذج');
  });
});

/* ========== بدء التشغيل ========== */
initArchive();

/* ========== Service Worker ========== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
  });
}
</script>
